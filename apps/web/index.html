<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#160c0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Orbit" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Orbit</title>
    <script>
      // iOS zooms into any field whose text is under 16px. `maximum-scale=1` stops that zoom, and iOS still lets people
      // pinch to zoom. Only on iOS: on Android it would block pinch zoom, and Android does not zoom into fields.
      if (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        var viewportMeta = document.querySelector('meta[name="viewport"]')
        if (viewportMeta) viewportMeta.content += ', maximum-scale=1'
      }
      // Apply the stored appearance before first paint (default: dark) to avoid a light flash. lib/theme.tsx owns it later.
      var theme = localStorage.getItem('theme')
      var root = document.documentElement
      root.classList.toggle('dark', theme === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : theme !== 'light')
      root.toggleAttribute('data-flat', localStorage.getItem('orbit:style') === 'flat')
      root.toggleAttribute('data-floating', localStorage.getItem('orbit:nav-style') === 'floating')
      root.toggleAttribute('data-new-ui', localStorage.getItem('orbit:layout') !== 'classic')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
