[package]
name = "orbit-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hmac = "0.12"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
http-body-util = "0.1"
include_dir = "0.7"
mime_guess = "2"
oxide-auth = "=0.6.1"
url = "2"
orbit-domain = { path = "../../crates/orbit" }
orbit-platform = { path = "../../crates/platform" }
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
thiserror = "2"
totp-rs = { version = "6", default-features = false, features = ["std", "otpauth", "qr"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
utoipa = { version = "5", features = ["axum_extras"] }
# Passkeys. 0.6 is pure Rust; 0.5 needs OpenSSL, which the static musl image does not have.
webauthn-rs = { version = "=0.6.1-dev", features = ["danger-allow-state-serialisation", "conditional-ui"] }
yrs = { version = "=0.28.0", features = ["sync"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
hkdf = "0.12"
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
webp = { version = "0.3.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"
