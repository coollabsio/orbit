name: 🔧 Improvement
description: "Suggest an improvement to an existing feature."
title: "[Improvement]: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Current Behavior
      description: How does the feature work now?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Suggested Improvement
      description: What should change, and why is it better?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional Information
      description: Screenshots, mockups, or any other relevant details.
