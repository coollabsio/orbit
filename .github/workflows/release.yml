name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: extractions/setup-just@v3
      - run: just setup
      - run: bun x playwright install --with-deps chromium
        working-directory: apps/web
      - run: just check
      - run: just e2e
      - run: docker build --build-arg ORBIT_BUILD_REVISION=${{ github.sha }} -t orbit:release .
      - run: docker run --rm orbit:release --help
      - name: Extract static binary
        run: |
          container=$(docker create orbit:release)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/orbit" orbit-x86_64-unknown-linux-musl
          sha256sum orbit-x86_64-unknown-linux-musl > orbit-x86_64-unknown-linux-musl.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            orbit-x86_64-unknown-linux-musl
            orbit-x86_64-unknown-linux-musl.sha256
