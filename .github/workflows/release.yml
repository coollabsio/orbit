name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: extractions/setup-just@v3
      - run: just setup
      - run: bun x playwright install --with-deps chromium
        working-directory: apps/web
      - run: just check
      - run: just e2e

  image:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            uname: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify native build host
        env:
          EXPECTED_UNAME: ${{ matrix.uname }}
        run: |
          test "$(uname -m)" = "$EXPECTED_UNAME"
          test "$(docker info --format '{{.Architecture}}')" = "$EXPECTED_UNAME"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}-${ARCHITECTURE}"
          docker build --build-arg ORBIT_BUILD_REVISION="$GITHUB_SHA" -t "$image" .
      - name: Verify and smoke-test native image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}-${ARCHITECTURE}"
          test "$(docker image inspect "$image" --format '{{.Architecture}}')" = "$ARCHITECTURE"
          docker run --rm "$image" --help
          bash deploy/smoke.sh "$image"
      - name: Publish architecture image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}-${ARCHITECTURE}"
          docker push "$image"

  publish:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish multi-platform manifest
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create \
            --tag "$image:$GITHUB_REF_NAME" \
            "$image:$GITHUB_REF_NAME-amd64" \
            "$image:$GITHUB_REF_NAME-arm64"
          docker buildx imagetools inspect "$image:$GITHUB_REF_NAME" | tee manifest.txt
          grep -E 'Platform:[[:space:]]+linux/amd64' manifest.txt
          grep -E 'Platform:[[:space:]]+linux/arm64' manifest.txt
      - name: Extract AMD64 static binary
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME-amd64"
          docker pull "$image"
          container=$(docker create "$image")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/orbit" orbit-x86_64-unknown-linux-musl
          sha256sum orbit-x86_64-unknown-linux-musl > orbit-x86_64-unknown-linux-musl.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            orbit-x86_64-unknown-linux-musl
            orbit-x86_64-unknown-linux-musl.sha256
