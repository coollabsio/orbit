name: TestFlight

# Builds the iOS app on EAS and submits it to TestFlight.
# Secrets: EXPO_TOKEN, ASC_API_KEY_P8 (contents of the .p8 file), ASC_KEY_ID, ASC_ISSUER_ID.
# Variables: ASC_APP_ID (App Store Connect → App Information → Apple ID), APPLE_TEAM_ID.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: bun
          token: ${{ secrets.EXPO_TOKEN }}
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
        run: |
          printf '%s\n' "$ASC_API_KEY_P8" > "$EXPO_ASC_API_KEY_PATH"
          jq --arg path "$EXPO_ASC_API_KEY_PATH" --arg key "$EXPO_ASC_KEY_ID" \
             --arg issuer "$EXPO_ASC_ISSUER_ID" --arg app "$ASC_APP_ID" \
             '.submit.production.ios = {ascApiKeyPath: $path, ascApiKeyId: $key, ascApiKeyIssuerId: $issuer, ascAppId: $app}' \
             eas.json > eas.ci.json && mv eas.ci.json eas.json
      - run: eas build --platform ios --profile production --auto-submit --non-interactive
