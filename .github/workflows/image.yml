name: Container image

on:
  push:
    branches: [main]
  # Releases the version in Cargo.toml when it has no tag yet, for example after a failed release run.
  workflow_dispatch:

# A later push cancels the run of an older one, but never a release run: `scripts/release.sh` pushes
# `chore(release): <version>`, and that run gets a group of its own.
concurrency:
  group: "${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release): ')) && github.run_id || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  # `[workspace.package] version` in Cargo.toml is the Orbit version. A push to main that changes it releases it
  # (see RELEASE.md): the image gets `<version>`, `<major>.<minor>` and `latest`, GitHub gets the release `v<version>`
  # with the notes of CHANGELOG.md, and the CDN gets the version for the update check of self-hosted servers.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version from Cargo.toml
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(bash scripts/version.sh)
          echo "Orbit version: $version"
          release=false
          if [ "$REF" != refs/heads/main ]; then
            echo "only main releases"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is released already"
          elif [ "$EVENT" = workflow_dispatch ]; then
            release=true
          elif git cat-file -e "$BEFORE:Cargo.toml" 2> /dev/null \
            && [ "$(git show "$BEFORE:Cargo.toml" | bash scripts/version.sh --stdin)" != "$version" ]; then
            release=true
          fi
          echo "release=$release" | tee -a "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            uname: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify native build host
        env:
          EXPECTED_UNAME: ${{ matrix.uname }}
        run: |
          test "$(uname -m)" = "$EXPECTED_UNAME"
          test "$(docker info --format '{{.Architecture}}')" = "$EXPECTED_UNAME"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Set image name
        id: image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}-${ARCHITECTURE}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - name: Build native image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: ORBIT_BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.image.outputs.name }}
          load: true
          cache-from: type=gha,scope=orbit-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=orbit-${{ matrix.architecture }}
      - name: Verify and smoke-test native image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}-${ARCHITECTURE}"
          test "$(docker image inspect "$image" --format '{{.Architecture}}')" = "$ARCHITECTURE"
          docker run --rm "$image" --help
          bash deploy/smoke.sh "$image"
      - name: Publish architecture image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}-${ARCHITECTURE}"
          docker push "$image"
      # A release also gets the smoke-tested executable, so people can run Orbit without Docker.
      - name: Extract release binary
        if: needs.version.outputs.release == 'true'
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          UNAME: ${{ matrix.uname }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}-${ARCHITECTURE}"
          binary="orbit-linux-$UNAME"
          container=$(docker create "$image")
          docker cp "$container:/orbit" "$binary"
          docker rm -v "$container"
          file "$binary" | tee file.txt
          grep -E 'static(-pie|ally) linked' file.txt
          grep ', stripped' file.txt
          "./$binary" --help > /dev/null
          mkdir package
          mv "$binary" package/orbit
          XZ_OPT=-9 tar -C package -cJf "$binary.tar.xz" orbit
      - name: Keep release binary for the release job
        if: needs.version.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: orbit-linux-${{ matrix.uname }}
          path: orbit-linux-${{ matrix.uname }}.tar.xz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [version, image]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish multi-platform manifest
        env:
          RELEASE: ${{ needs.version.outputs.release }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag=${GITHUB_SHA::7}
          if [ "$RELEASE" = true ]; then
            published="$image:$VERSION"
            tags=(--tag "$image:$VERSION")
            # a pre-release (for example 0.2.0-rc.1) gets only its exact tag
            if [[ "$VERSION" != *-* ]]; then
              tags+=(--tag "$image:${VERSION%.*}" --tag "$image:latest")
            fi
          else
            published="$image:$tag"
            tags=(--tag "$image:$tag" --tag "$image:main")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$image:$tag-amd64" \
            "$image:$tag-arm64"
          docker buildx imagetools inspect "$published" | tee manifest.txt
          grep -E 'Platform:[[:space:]]+linux/amd64' manifest.txt
          grep -E 'Platform:[[:space:]]+linux/arm64' manifest.txt
      - name: Deploy to Coolify Cloud
        if: github.event_name == 'push'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEBHOOK"

  # The GitHub release comes after the image tags, so its tag never points at a version without an image.
  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, image, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: orbit-linux-*
          merge-multiple: true
      - name: Create the GitHub release with binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          files=(orbit-linux-x86_64.tar.xz orbit-linux-aarch64.tar.xz)
          sha256sum "${files[@]}" | tee SHA256SUMS
          # the section `## [v<version>]` that scripts/release.sh wrote, its `###` headings as `##`
          awk -v heading="## [$tag]" 'index($0, heading) == 1 { inside = 1; next } /^## / { inside = 0 } inside { sub(/^### /, "## "); print }' CHANGELOG.md > notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # --clobber replaces the files when the workflow runs again for the same release
            gh release upload "$tag" "${files[@]}" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          args=(--title "$tag" --target "$GITHUB_SHA")
          if grep -q '[^[:space:]]' notes.md; then args+=(--notes-file notes.md); else args+=(--generate-notes); fi
          [[ "$VERSION" != *-* ]] || args+=(--prerelease)
          gh release create "$tag" "${files[@]}" SHA256SUMS "${args[@]}" --repo "$GITHUB_REPOSITORY"

  # Self-hosted servers read the latest stable version from https://cdn.coollabs.io/orbit/version.json.
  cdn:
    if: needs.version.outputs.release == 'true' && !contains(needs.version.outputs.version, '-')
    needs: [version, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set the latest version on the CDN
        env:
          # a fine-grained token for coollabsio/coollabs-cdn alone, with read and write access to contents
          GH_TOKEN: ${{ secrets.CDN_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/sync-cdn.sh "$VERSION"
