version: "3"

# Load project-specific deployment config (ShadowArcanist stuff)
dotenv:
  - deployment.conf

vars:
  # Absolute path to the global deployment pipeline (ShadowArcanist stuff)
  DEPLOY_PIPELINE_DIR: "{{.HOME}}/developer/admin/deployment-pipeline"

tasks:
  dev:
    desc: Run the Discord bot and dashboard in development mode
    deps:
      - dev:server
      - dev:web
      - dev:site

  dev:server:
    internal: true
    dir: apps/server
    env:
      APP_ENV: dev
    cmds:
      - cargo watch -x run

  dev:web:
    internal: true
    dir: apps/web
    cmds:
      - bun run dev

  dev:site:
    internal: true
    dir: apps/site
    cmds:
      - bun run dev

  deploy: # (ShadowArcanist stuff)
    desc: Deploy this project using the global CI/CD pipeline
    silent: true 
    cmds:
      - '[ -f "{{.DEPLOY_PIPELINE_DIR}}/Taskfile.yml" ] || { echo "Global Taskfile not found"; exit 1; }'
      - task -d {{.DEPLOY_PIPELINE_DIR}} deploy PROJECT_DIR="{{.PWD}}"
