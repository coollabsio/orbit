<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="-10 -10 120 120">
  <!-- Orbit planet mark: the OrbitMark from marketing/launch-video/src/components/Logo.tsx (commit d1bb1df) at rest (moon at 2.2 rad). -->
  <defs>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8ac0"/>
      <stop offset="55%" stop-color="#f2458f"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="planet-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#f2458f" flood-opacity="0.6"/>
    </filter>
    <filter id="moon-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#fff"/>
    </filter>
    <mask id="ring-behind" maskUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120">
      <rect x="-10" y="-10" width="120" height="120" fill="#fff"/>
      <path d="M26 50A24 24 0 0 1 74 50Z" fill="#000"/>
    </mask>
  </defs>
  <g transform="rotate(-18 50 50)">
    <circle cx="50" cy="50" r="24" fill="url(#planet)" filter="url(#planet-glow)"/>
    <!-- one closed ring, hidden where the top half of the planet covers it (no seams) -->
    <ellipse cx="50" cy="50" rx="46" ry="16" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="3" mask="url(#ring-behind)"/>
    <circle cx="22.93" cy="62.94" r="4.2" fill="#fff" filter="url(#moon-glow)"/>
  </g>
</svg>
