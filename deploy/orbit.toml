# The default configuration of the container image (/etc/orbit/orbit.toml). Set the rest with environment
# variables, which override every value here: ORBIT__<SECTION>__<KEY>, for example
#   ORBIT__HTTP__PUBLIC_ORIGIN=https://orbit.example.com   (required)
#   ORBIT__HTTP__TRUSTED_PROXIES=172.30.0.2/32              (required: your reverse proxy)
#   ORBIT__DATA__DATABASE_URL=postgres://…                  (optional: Postgres instead of SQLite)
#   ORBIT__SECRETS__APP_KEY=…                                (required with Postgres)
# Production refuses to start without an https public origin and a trusted proxy.
environment = "production"

[http]
# 0.0.0.0 works for containers and Tailscale interfaces. Firewall the port.
bind = "0.0.0.0"
port = 8080

[data]
# Keep the database, attachment directory, and backup directory separate.
database = "/var/lib/orbit/orbit.sqlite"
attachments = "/var/lib/orbit/attachments"
# Backups must be outside the live attachment directory.
backups = "/var/backups/orbit"

[jobs]
concurrency = 4

[uploads]
max_file_bytes = 26214400
max_request_bytes = 104857600

[rate_limits]
# Requests per minute for each client IP address (IPv6 grouped by /64) and each session or token;
# 1..=1000000. A workspace gets workspace_multiplier (1..=1000) times each limit. Authentication,
# recovery and invitation requests are counted for all servers of the database, the others per server.
authentication_per_minute = 30
recovery_per_minute = 10
invitation_per_minute = 60
upload_per_minute = 120
general_per_minute = 600
workspace_multiplier = 10
# Registration and password reset emails to one address: the time between two (0..=86400 s) and the
# number in 24 hours. Invitation emails in 24 hours per workspace and per inviter. Daily caps: 1..=100000.
account_email_cooldown_seconds = 60
account_emails_per_day = 5
invitation_emails_per_workspace_per_day = 100
invitation_emails_per_inviter_per_day = 50

# Metrics are disabled unless a private listener is configured.
[metrics]
# listen = "127.0.0.1:9090"

# Outgoing email (invitations, sign-up and password reset links) is configured by the root user in
# Admin → Settings, not here. Secrets saved there are encrypted with `secrets.app_key`; without it, Orbit
# creates `app.key` beside the database on first start. Keep that file with your backups.
