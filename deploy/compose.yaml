services:
  orbit:
    build:
      context: ..
    image: ${ORBIT_IMAGE:-orbit:local}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m,mode=1777]
    stop_grace_period: 40s
    environment:
      ORBIT_ENV: production
      ORBIT_PUBLIC_ORIGIN: https://${ORBIT_DOMAIN:?Set ORBIT_DOMAIN in deploy/.env}
      # Caddy, and loopback for the image healthcheck.
      ORBIT_TRUSTED_PROXIES: 127.0.0.1/32,172.30.0.2/32
      ORBIT_APP_KEY: ${ORBIT_APP_KEY:?Set ORBIT_APP_KEY in deploy/.env}
    volumes:
      - orbit-data:/var/lib/orbit
      - orbit-backups:/var/backups/orbit
    networks: [backend]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ORBIT_DOMAIN: ${ORBIT_DOMAIN:?Set ORBIT_DOMAIN in deploy/.env}
    ports: ['80:80', '443:443']
    # The admin API answers on localhost:2019 once Caddy has loaded its configuration.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      backend:
        ipv4_address: 172.30.0.2
networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24
volumes:
  orbit-data:
  orbit-backups:
  caddy-data:
  caddy-config:
