services:
  coolbot:
    image: 'ghcr.io/coollabsio/coolbot:latest'
    pull_policy: always
    environment:
      - SERVICE_URL_COOLBOT_3000
      - APP_ENV=production
      - PUBLIC_URL=$SERVICE_URL_COOLBOT
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-2}
      - COOLBOT_DISCORD_TOKEN=${COOLBOT_DISCORD_TOKEN:?}
      - MODMAIL_DISCORD_TOKEN=${MODMAIL_DISCORD_TOKEN}
      - DISCORD_OAUTH_CLIENT_ID=${DISCORD_OAUTH_CLIENT_ID}
      - DISCORD_OAUTH_CLIENT_SECRET=${DISCORD_OAUTH_CLIENT_SECRET}
      - DASHBOARD_SESSION_SECRET=$SERVICE_PASSWORD_SESSION
      - NTFY_TOPIC=${NTFY_TOPIC}
      - NTFY_RESPONSE_TOPIC=${NTFY_RESPONSE_TOPIC}
      - RUST_LOG=${RUST_LOG:-error}
    volumes:
      - 'coolbot-data:/data'
